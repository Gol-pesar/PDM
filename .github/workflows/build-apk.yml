name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-}"
          java_version_output="$(java -version 2>&1)"
          echo "$java_version_output"

          version_token="$(printf '%s\n' "$java_version_output" | awk -F '"' '/version/ {print $2; exit}')"
          if [[ -z "$version_token" ]]; then
            echo "::error::Unable to detect the active Java version from 'java -version'."
            exit 1
          fi

          if [[ "$version_token" == 1.* ]]; then
            java_major="$(printf '%s' "$version_token" | cut -d'.' -f2)"
          else
            java_major="$(printf '%s' "$version_token" | cut -d'.' -f1 | sed 's/[^0-9].*$//')"
          fi

          if [[ -z "$java_major" || ! "$java_major" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to parse Java major version from '$version_token'."
            exit 1
          fi

          echo "Detected active Java major version: $java_major"
          if (( java_major < 17 )); then
            echo "::error::Java 17 or newer is required, but detected Java $java_major."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Prepare debug keystore
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -f "./debug.keystore" ]]; then
            echo "Debug keystore already exists at ./debug.keystore; skipping generation."
          elif [[ -n "${DEBUG_KEYSTORE_BASE64:-}" ]]; then
            echo "Restoring persistent debug keystore from DEBUG_KEYSTORE_BASE64 secret."
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "./debug.keystore"
          else
            if [[ -z "${JAVA_HOME:-}" || ! -x "$JAVA_HOME/bin/keytool" ]]; then
              echo "::error::keytool from the configured Java 17 installation was not found at \$JAVA_HOME/bin/keytool."
              exit 1
            fi

            "$JAVA_HOME/bin/keytool" -genkeypair -v \
              -keystore "./debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -sigalg SHA256withRSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          fi

          if [[ ! -f "./debug.keystore" || ! -s "./debug.keystore" ]]; then
            echo "::error::Failed to prepare debug keystore at ./debug.keystore."
            exit 1
          fi
          echo "Verified debug keystore exists."

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Align and sign APK for universal Android compatibility (v1 + v2 + v3)
        shell: bash
        run: |
          set -euo pipefail
          expected_apk="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "$expected_apk" || ! -s "$expected_apk" ]]; then
            echo "::error::Expected debug APK not found or empty at $expected_apk."
            exit 1
          fi

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          build_tools_dir="$(ls -d "${sdk_root}"/build-tools/* 2>/dev/null | sort -V | tail -n 1 || true)"

          if [[ -z "$build_tools_dir" || ! -x "${build_tools_dir}/zipalign" || ! -x "${build_tools_dir}/apksigner" ]]; then
            echo "::error::Android SDK build-tools (zipalign and apksigner) not found under ${sdk_root}/build-tools."
            exit 1
          fi
          echo "Using Android build-tools: ${build_tools_dir}"

          work_dir="$(mktemp -d "${RUNNER_TEMP}/apk-sign.XXXXXX")"
          clean_apk="${work_dir}/app-unsigned.apk"
          aligned_apk="${work_dir}/app-aligned.apk"
          signed_apk="${work_dir}/app-signed.apk"

          cp -- "$expected_apk" "$clean_apk"
          zip -qd "$clean_apk" "META-INF/MANIFEST.MF" "META-INF/*.SF" "META-INF/*.RSA" "META-INF/*.DSA" "META-INF/*.EC" 2>/dev/null || true

          if "${build_tools_dir}/zipalign" -f -P 16 4 "$clean_apk" "$aligned_apk" 2>/dev/null; then
            align_check_args=(-c -P 16 4)
            echo "Aligned APK with 16KB + 4-byte alignment."
          else
            "${build_tools_dir}/zipalign" -f -p 4 "$clean_apk" "$aligned_apk"
            align_check_args=(-c -p 4)
            echo "Aligned APK with 4KB page + 4-byte alignment."
          fi

          "${build_tools_dir}/apksigner" sign \
            --ks "./debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --min-sdk-version 23 \
            --out "$signed_apk" \
            "$aligned_apk"

          mv -f -- "$signed_apk" "$expected_apk"
          rm -rf -- "$work_dir"

          "${build_tools_dir}/zipalign" "${align_check_args[@]}" "$expected_apk"
          verify_output="$("${build_tools_dir}/apksigner" verify --verbose --print-certs "$expected_apk")"
          echo "$verify_output"

          for scheme in "v1 scheme" "v2 scheme" "v3 scheme"; do
            if ! grep -q "Verified using ${scheme}.*: true" <<< "$verify_output"; then
              echo "::error::APK signature verification failed for ${scheme}."
              exit 1
            fi
          done

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          expected_apk="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -e "$expected_apk" ]]; then
            echo "::error::Expected debug APK not found at $expected_apk."
            if [[ -d "app/build/outputs/apk" ]]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [[ ! -f "$expected_apk" ]]; then
            echo "::error::$expected_apk exists but is not a regular file."
            exit 1
          fi

          if [[ ! -s "$expected_apk" ]]; then
            echo "::error::$expected_apk is empty."
            exit 1
          fi

          if [[ "$expected_apk" != *.apk ]]; then
            echo "::error::$expected_apk does not have the .apk extension."
            exit 1
          fi

          apk_size="$(wc -c < "$expected_apk")"
          echo "Verified debug APK: $expected_apk ($apk_size bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        shell: bash
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "$source_apk" || ! -s "$source_apk" || "$source_apk" != *.apk ]]; then
            echo "::error::Verified debug APK is missing or invalid at $source_apk."
            exit 1
          fi

          repo_raw="${GITHUB_REPOSITORY#*/}"
          repo_sanitized="$(printf '%s' "$repo_raw" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^[-._]+//; s/[-._]+$//')"
          if [[ -z "$repo_sanitized" ]]; then
            repo_sanitized="android-app"
          fi

          release_dir="$(mktemp -d "${RUNNER_TEMP}/apk-release.XXXXXX")"
          asset_name="${repo_sanitized}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          asset_path="${release_dir}/${asset_name}"

          cp -- "$source_apk" "$asset_path"

          if [[ ! -f "$asset_path" || ! -s "$asset_path" || "$asset_path" != *.apk ]]; then
            echo "::error::Failed to prepare APK release asset at $asset_path."
            exit 1
          fi

          echo "Prepared release asset: $asset_name"
          {
            echo "asset_path=$asset_path"
            echo "asset_name=$asset_name"
          } >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
        run: |
          set -euo pipefail

          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::GitHub CLI (gh) is not available on this runner."
            exit 1
          fi
          gh --version

          if [[ -z "${ASSET_PATH:-}" || ! -f "$ASSET_PATH" || ! -s "$ASSET_PATH" || "$ASSET_PATH" != *.apk ]]; then
            echo "::warning::Prepared APK release asset is missing, empty, or does not have the .apk extension."
            exit 1
          fi

          release_tag="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          release_title="Debug APK Build #${GITHUB_RUN_NUMBER}"

          release_notes="$(printf '%s\n' \
            "This is an automatically generated debug APK built by GitHub Actions." \
            "" \
            "- **Workflow Run Number:** ${GITHUB_RUN_NUMBER}" \
            "- **Workflow Run Attempt:** ${GITHUB_RUN_ATTEMPT}" \
            "- **Source Commit SHA:** ${GITHUB_SHA}" \
            "- **APK Asset:** ${ASSET_NAME}" \
            "- **Android Compatibility:** Android 6.0 (API 23) – Android 16 (API 36), universal ABIs (arm64-v8a, armeabi-v7a, x86, x86_64), 16KB page-aligned, signed with v1 + v2 + v3 schemes." \
            "" \
            "If you previously installed an older debug build signed with a different temporary key, uninstall the previous version first before installing this APK.")"

          gh release create "$release_tag" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$release_title" \
            --notes "$release_notes" \
            --latest

          {
            echo "release_tag=$release_tag"
            echo "release_title=$release_title"
          } >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always() && (steps.publish_release.outcome == 'success' || steps.publish_release.outcome == 'failure')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: ${{ steps.publish_release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.publish_release.outputs.release_title }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
        run: |
          set -euo pipefail

          if [[ "$PUBLISH_OUTCOME" == "success" && -n "${RELEASE_TAG:-}" ]]; then
            if release_url="$(gh release view "$RELEASE_TAG" --json url --jq '.url' 2>/dev/null)" && [[ -n "$release_url" ]]; then
              echo "Release tag: $RELEASE_TAG"
              echo "Release title: $RELEASE_TITLE"
              echo "Release page URL: $release_url"
              echo "APK asset filename: $ASSET_NAME"
              echo "The APK can be downloaded directly from the Assets section of the release page."
              echo "Backup Actions artifact: app-debug-apk"

              {
                echo "## Debug APK Build & Release Summary"
                echo ""
                echo "- **Status:** APK build, Actions artifact upload, and GitHub Release publishing succeeded."
                echo "- **Release Tag:** \`${RELEASE_TAG}\`"
                echo "- **Release Title:** ${RELEASE_TITLE}"
                echo "- **Direct Release Page:** ${release_url}"
                echo "- **APK Asset Filename:** \`${ASSET_NAME}\`"
                echo ""
                echo "Download the APK directly from the **Assets** section on the GitHub Release page above."
                echo "The standard GitHub Actions artifact (\`app-debug-apk\`) is also available as a backup on this workflow run."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          echo "::warning::GitHub Release publishing failed or could not be verified. The debug APK build succeeded, and the GitHub Actions artifact 'app-debug-apk' remains available for download."
          {
            echo "## Debug APK Build Summary (Release Publishing Warning)"
            echo ""
            echo "> **Warning:** Publishing to GitHub Releases failed or could not be verified."
            echo ""
            echo "- **APK Build:** Succeeded"
            echo "- **Actions Artifact Upload:** Succeeded"
            echo "- **Backup Artifact Name:** \`app-debug-apk\`"
            echo ""
            echo "You can still download the debug APK from the **Artifacts** section of this GitHub Actions workflow run (\`app-debug-apk\`)."
          } >> "$GITHUB_STEP_SUMMARY"
